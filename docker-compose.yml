version: "3.8"

services:
  mongodb:
    image: mongo:6.0
    container_name: mindmate-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  ai-service:
    build: ./ai-service
    container_name: mindmate-ai
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    environment:
      - PORT=8000

  server:
    build: ./server
    container_name: mindmate-server
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - ai-service
    env_file:
      - ./server/.env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/mindmate
      - FASTAPI_SERVICE_URL=http://ai-service:8000

volumes:
  mongo-data: